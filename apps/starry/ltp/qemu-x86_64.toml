args = [
    "-nographic",
    "-m",
    "1G",
    "-device",
    "virtio-blk-pci,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-debian.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = false
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/run-ltp.sh"
success_regex = ['(?m)LTP TEST COMPLETE']
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 600
