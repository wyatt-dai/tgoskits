args = [
    "-nographic",
    "-m",
    "1G",
    "-cpu",
    "cortex-a53",
    "-machine",
    "virt,gic-version=3",
    "-device",
    "virtio-blk-pci,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-debian.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
    "-monitor",
    "telnet:localhost:4444,server,nowait",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "START=1 /usr/bin/run-ltp.sh"
success_regex = ['(?m)LTP TEST COMPLETE']
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 7200
