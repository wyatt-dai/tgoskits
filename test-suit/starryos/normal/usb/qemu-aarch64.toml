args = [
  "-nographic",
  "-cpu",
  "cortex-a53",
  "-device",
  "virtio-blk-pci,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/target/aarch64-unknown-none-softfloat/rootfs-aarch64.img",
  "-device",
  "virtio-net-pci,netdev=net0",
  "-netdev",
  "user,id=net0",
]
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  "USB test failed",
]
shell_init_cmd = "/usr/bin/usb-transfer-test"
shell_prefix = "root@starry:"
success_regex = ["(?m)^USB enumeration tests passed!\\s*$"]
timeout = 10
to_bin = true
uefi = false
